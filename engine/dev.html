<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPUS engine — host page</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0f; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #start { pointer-events: auto; position: absolute; left: 50%; top: 62%; transform: translateX(-50%); padding: 10px 22px; font: 14px ui-monospace, Menlo, Consolas, monospace; background: #1b2024; color: #e8ece6; border: 1px solid #5a646a; cursor: pointer; }
  #help { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: #aab2a8; font: 12px ui-monospace, Menlo, Consolas, monospace; text-shadow: 0 1px 2px #000; }
  #fatal { position: absolute; inset: auto 0 0 0; padding: 12px; background: #5a1010; color: #fff; font: 13px ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="ui"></div>
</div>
<script type="module" src="./host/dev-host.js"></script>
</body>
</html>
